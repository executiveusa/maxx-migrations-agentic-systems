name: One-time Crown Core Prettier formatting
on:
  push:
    branches: [feat/crown-core-paperclip-vibe-audit]
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'executiveusa/maxx-migrations-agentic-systems' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Format ONLY identified PR Prettier failures using pinned hook version
        run: |
          set -euo pipefail
          npx --yes prettier@2.7.1 --write \
            apps/maxx-web/lib/offers/crown-core.mjs \
            apps/maxx-web/mcp/maxx-migrations-server.mjs \
            apps/maxx-web/tests/node/crown-core-mcp.test.mjs \
            apps/maxx-web/tests/node/crown-core-offer.test.mjs \
            apps/maxx-web/tests/node/crown-core-paperclip.test.mjs \
            apps/maxx-web/tests/node/crown-core-sql-contract.test.mjs \
            ops/paperclip/bootstrap.mjs \
            ops/paperclip/crown-core-plan.mjs
      - name: Commit only explicitly named feature JS files
        env:
          GH_REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "feat/crown-core-paperclip-vibe-audit"
          git add -- \
            apps/maxx-web/lib/offers/crown-core.mjs \
            apps/maxx-web/mcp/maxx-migrations-server.mjs \
            apps/maxx-web/tests/node/crown-core-mcp.test.mjs \
            apps/maxx-web/tests/node/crown-core-offer.test.mjs \
            apps/maxx-web/tests/node/crown-core-paperclip.test.mjs \
            apps/maxx-web/tests/node/crown-core-sql-contract.test.mjs \
            ops/paperclip/bootstrap.mjs \
            ops/paperclip/crown-core-plan.mjs
          if git diff --cached --quiet; then
            echo 'All targeted files already formatted'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(crown-core): conform to pinned Prettier 2.7.1 hooks'
          hdr="$(printf 'x-access-token:%s' "$GH_REPO_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $hdr" push origin HEAD:refs/heads/feat/crown-core-paperclip-vibe-audit
