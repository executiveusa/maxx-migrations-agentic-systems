name: MAXX A2A ten-minute watch

# Scheduled workflows run only from the repository default branch.
# This monitor is read-only: it does not invoke an LLM, merge, deploy, or post comments.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/maxx-a2a-watch.yml'
      - 'ops/a2a/**'

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: maxx-a2a-watch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  watch:
    name: Read-only Instinct and controller heartbeat check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITHUB_TOKEN: ${{ github.token }}
      A2A_REPOSITORY: executiveusa/maxx-migrations-agentic-systems
      A2A_PR_NUMBER: '37'
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Run watcher unit tests
        run: python3 -m unittest discover -s ops/a2a -p 'test_*.py' -v
      - name: Inspect PR mailbox and write evidence
        run: python3 ops/a2a/watch.py
      - name: Archive non-secret monitor evidence
        uses: actions/upload-artifact@v4
        with:
          name: maxx-a2a-watch-${{ github.run_id }}
          path: maxx-a2a-watch.json
          retention-days: 14
