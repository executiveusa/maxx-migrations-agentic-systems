name: MAXX Web CI

on:
  pull_request:
    paths:
      - "apps/maxx-web/**"
      - "icm/revenue-capture-os/**"
      - ".github/workflows/maxx-web-ci.yml"
  push:
    branches:
      - develop
      - main
    paths:
      - "apps/maxx-web/**"
      - "icm/revenue-capture-os/**"
      - ".github/workflows/maxx-web-ci.yml"

permissions:
  contents: read

concurrency:
  group: maxx-web-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint · typecheck · unit · walk · audit · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/maxx-web

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/maxx-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Revenue Capture ICM walk test
        run: npm run walk:revenue-capture

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Production build
        run: npm run build
