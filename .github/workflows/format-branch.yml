name: Format branch

on:
  push:
    branches:
      - architecture/four-bucket-growth-engine

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: architecture/four-bucket-growth-engine
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Run repository formatters
        run: |
          python -m pip install pre-commit
          pre-commit run --all-files || true
      - name: Commit formatter changes
        run: |
          if git diff --quiet; then
            echo 'No formatter changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: apply repository formatters'
          git push origin HEAD:architecture/four-bucket-growth-engine
